<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game</title>
    <style>
        /* Optional: Makes the iframe fill the screen nicely */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
        .game-embed, iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div class="game-embed" id="embed-container"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const target = urlParams.get('target');

        if (target) {
            const iframe = document.createElement('iframe');
            iframe.src = `/embed?${encodeURIComponent(target)}`;
            iframe.allowFullscreen = true;
            document.getElementById('embed-container').appendChild(iframe);
        }
    </script>
</body>
</html>

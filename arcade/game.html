<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101114">
    <meta name="description" content="Find your next way to play with SamWorks Arcade: quick browser games, Minecraft community servers, and gaming guides.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="SamWorks Arcade — Play your way">
    <meta property="og:description" content="A little corner of the internet for quick plays, blocky adventures, and finding your next favorite thing.">
    <meta property="og:image" content="https://samworks.cyberdeep.qzz.io/arcade/assets/Arcade.png">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="assets/Arcade-NBG.png" type="image/png">
    <link rel="stylesheet" href="assets/css/index.css">
    <title>Game</title>
    <style>
        /* Optional: Makes the iframe fill the screen nicely */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
        .game-embed, iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div class="game-embed" id="embed-container"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const target = urlParams.get('target');

        if (target) {
            const iframe = document.createElement('iframe');
            iframe.src = `/arcade/embed?target=${encodeURIComponent(target)}`;
            iframe.allowFullscreen = true;
            document.getElementById('embed-container').appendChild(iframe);
        }
    </script>
</body>
</html>
